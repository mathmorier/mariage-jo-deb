
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariés - Contrôle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars-container" id="stars"></div>
    
    <div class="slider-container">
        <div class="card" id="main-card">
            <div class="level-tag" id="level">LEVEL 1</div>
            <h2 id="title">LE PROTOCOLE C-3PO</h2>
        </div>
        <div class="nav">
            <button class="btn" onclick="change(-1)">PRÉCÉDENT</button>
            <button class="btn" onclick="change(1)">SUIVANT</button>
        </div>
    </div>

    <script>
        const items = [
            {l:"LEVEL 1", t:"Le Protocole C-3PO"},
            {l:"LEVEL 1", t:"Le Viseur de Vador"},
            {l:"LEVEL 1", t:"Alignement des Planètes"},
            {l:"LEVEL 1", t:"L'Armée de Clones"},
            {l:"LEVEL 2", t:"Bordure Extérieure"},
            {l:"LEVEL 2", t:"L'Académie Jedi"},
            {l:"LEVEL 2", t:"Le Clan Skywalker"},
            {l:"LEVEL 2", t:"La Cantina de Mos Eisley"},
            {l:"LEVEL 3", t:"Entraînement de Stormtrooper"},
            {l:"LEVEL 3", t:"L'Effet Cantina"},
            {l:"LEVEL 3", t:"Chasseur de Primes Indépendant"},
            {l:"LEVEL 3", t:"Le Droïde de Protocole"},
            {l:"LEVEL 3", t:"Le Pilote du Raid de Kessel"},
            {l:"FINAL", t:"L'ÉQUILIBRE DE LA FORCE"}
        ];
        let cur = 0;
        function update() {
            document.getElementById('level').innerText = items[cur].l;
            document.getElementById('title').innerText = items[cur].t;
        }
        function change(n) {
            cur += n;
            if(cur < 0) cur = 0;
            if(cur >= items.length) cur = items.length - 1;
            update();
        }
        // Star background
        const stars = document.getElementById('stars');
        for(let i=0; i<80; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random()*100+'vw';
            s.style.top = Math.random()*100+'vh';
            s.style.width = '1px'; s.style.height = '1px';
            stars.appendChild(s);
        }
    </script>
</body>
</html>
