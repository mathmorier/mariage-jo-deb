
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mariés - Le Jeu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars-container"></div>
    <div class="slider-wrapper" id="slider">
        <div class="card" id="card">
            <div id="lvl-tag" style="opacity:0.6; letter-spacing:2px;">LEVEL 1</div>
            <h2 id="card-title">CHARGEMENT...</h2>
            <div class="hint">Glissez vers la gauche ←</div>
        </div>
        <div class="dots" id="dots"></div>
    </div>

    <script>
const items = [
    {l:"LEVEL 1", t:"Le Protocole C-3PO"},
    {l:"LEVEL 1", t:"Le Viseur de Vador"},
    {l:"LEVEL 1", t:"Alignement des Planètes"},
    {l:"LEVEL 1", t:"L'Armée de Clones"},
    {l:"LEVEL 2", t:"Explo. de la Bordure Extérieure"},
    {l:"LEVEL 2", t:"L'Académie Jedi"},
    {l:"LEVEL 2", t:"Le Clan Skywalker"},
    {l:"LEVEL 2", t:"La Cantina de Mos Eisley"},
    {l:"LEVEL 3", t:"Entraînement de Stormtrooper"},
    {l:"LEVEL 3", t:"L'Effet Cantina"},
    {l:"LEVEL 3", t:"Chasseur de Primes Indépendant"},
    {l:"LEVEL 3", t:"Le Droïde de Protocole"},
    {l:"LEVEL 3", t:"Le Pilote du Raid de Kessel"},
    {l:"FINAL", t:"L'ÉQUILIBRE DE LA FORCE"}
];

        let index = 0;
        const titleEl = document.getElementById('card-title');
        const lvlEl = document.getElementById('lvl-tag');
        const dotsEl = document.getElementById('dots');

        function init() {
            items.forEach((_, i) => {
                const d = document.createElement('div');
                d.className = 'dot';
                dotsEl.appendChild(d);
            });
            update();
        }

        function update() {
            titleEl.innerText = items[index].t;
            lvlEl.innerText = items[index].l;
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });
        }

        // SWIPE LOGIC
        let touchStartX = 0;
        let touchEndX = 0;

        const slider = document.getElementById('slider');
        slider.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        slider.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchStartX - touchEndX > 50) { // Swipe Left
                if (index < items.length - 1) {
                    index++;
                    update();
                }
            }
            if (touchEndX - touchStartX > 50) { // Swipe Right
                if (index > 0) {
                    index--;
                    update();
                }
            }
        }

        // Stars
        const starsC = document.getElementById('stars-container');
        for(let i=0; i<80; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = '1px'; s.style.height = '1px';
            s.style.left = Math.random()*100+'vw';
            s.style.top = Math.random()*100+'vh';
            starsC.appendChild(s);
        }

        init();
    </script>
</body>
</html>
